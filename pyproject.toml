[project]
name = "data-product-control-plane"
version = "1.0.0"
description = "Self-serve data platform on Snowflake and AWS: one YAML file onboards a data product"
requires-python = ">=3.11"
dependencies = [
  "snowflake-connector-python>=3.12,<4",
  "pydantic>=2.6",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pandas>=2.1",
]

[project.optional-dependencies]
local = ["fakesnow==0.12.1"]   # Snowflake's Python API on DuckDB, for tests and the simulated world
mcp = ["mcp>=2"]
kafka = ["confluent-kafka>=2.3"]
dev = ["fakesnow==0.12.1", "mcp>=2", "confluent-kafka>=2.3", "pytest>=8", "ruff>=0.6"]

[project.scripts]
dpcp = "dpcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Header()/Query() defaults
